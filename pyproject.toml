[project]
name = "yurecheck-tools"
version = "0.1.0"
description = "Yurecheck の開発環境を保守するスクリプト(status, handoff, commit, test, determinism)と Claude Code の hooks。製品(Unity)とは別物"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["tools", ".claude/hooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
